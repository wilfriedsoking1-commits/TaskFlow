<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Gestion de tâches</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="container">
        <header class="app-header">
            <h1>📋 TaskFlow</h1>
            <p class="subtitle">Organisez vos tâches en toute simplicité</p>
        </header>

        <!-- Formulaire d'ajout de tâche -->
        <section class="add-task-section">
            <form id="addTaskForm" class="add-task-form">
                <div class="input-group">
                    <input
                        type="text"
                        id="taskTitle"
                        name="title"
                        placeholder="Nouvelle tâche..."
                        required
                        maxlength="200"
                    >
                    <input
                        type="text"
                        id="taskDescription"
                        name="description"
                        placeholder="Description (optionnel)"
                        maxlength="500"
                    >
                    <button type="submit" id="addBtn">Ajouter</button>
                </div>
                <div id="formError" class="error-message" role="alert"></div>
            </form>
        </section>

        <!-- Statistiques -->
        <section class="stats">
            <div class="stat-card">
                <span class="stat-number" id="totalTasks">0</span>
                <span class="stat-label">Tâches</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="completedTasks">0</span>
                <span class="stat-label">Terminées</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="pendingTasks">0</span>
                <span class="stat-label">En cours</span>
            </div>
        </section>

        <!-- Liste des tâches -->
        <section class="tasks-section">
            <div class="tasks-header">
                <h2>Mes tâches</h2>
                <button id="clearCompletedBtn" class="btn-clear" aria-label="Supprimer les tâches terminées">
                    Supprimer les terminées
                </button>
            </div>

            <ul id="taskList" class="task-list">
                <!-- Les tâches sont injectées ici par JavaScript -->
            </ul>

            <div id="emptyState" class="empty-state">
                <p>Aucune tâche pour le moment. Ajoutez votre première tâche !</p>
            </div>
        </section>

        <footer class="app-footer">
            <p>TaskFlow &copy; 2026 - Gestion de tâches simple et efficace</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
